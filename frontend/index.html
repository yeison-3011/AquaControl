<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaControl Cali</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <nav class="navbar">

    <div class="logo">
        AquaControl Cali 🚰
    </div>

    <ul class="menu">

        <li>Inicio</li>
        <li>Dashboard</li>
        <li>Reportes</li>

        <li onclick="cerrarSesion()" class="logout">
            Cerrar Sesión
        </li>

    </ul>

</nav>


    <div class="container">

        <h1>AquaControl Cali 🚰</h1>

        <div class="estadisticas">

    <div class="card-estadistica">

        <h3>Total Consumo</h3>

        <p id="totalLitros">0 Litros</p>

    </div>

    <div class="card-estadistica">

        <h3>Promedio</h3>

        <p id="promedioLitros">0 Litros</p>

    </div>

    <div class="card-estadistica">

        <h3>Estado</h3>

        <p id="estadoConsumo">Normal</p>

    </div>

</div>

        <div class="card">

    <h2>Registro Usuario</h2>

    <form id="formRegistro">

        <input
            type="text"
            id="nombre"
            placeholder="Nombre"
            required
        >

        <input
            type="email"
            id="correo"
            placeholder="Correo"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p id="mensajeRegistro"></p>

</div>

<div class="card">

    <h2>Iniciar Sesión</h2>

    <form id="formLogin">

        <input
            type="email"
            id="loginCorreo"
            placeholder="Correo"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Ingresar
        </button>

    </form>

    <p id="mensajeLogin"></p>

</div>

        <div class="card">

            <h2>Registrar Consumo</h2>

            <form id="formConsumo">

                <input
                    type="number"
                    id="litros"
                    placeholder="Litros consumidos"
                    required
                >

                <button type="submit">
                    Registrar
                </button>

            </form>

            <p id="mensaje"></p>

        </div>

        <div class="card">

            <h2>Consumo del Hogar</h2>

            <canvas id="graficaConsumo"></canvas>

        </div>

        <div class="card">

            <h2>Historial de Consumos</h2>

            <ul id="listaConsumos"></ul>

            <button onclick="exportarPDF()">
                Descargar PDF
            </button>

        </div>
        

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
